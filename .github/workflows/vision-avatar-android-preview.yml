name: Vision Avatar Android Offline Preview (compile only)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vision-avatar-android-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  avatar-android-preview:
    if: github.head_ref == 'ci/vision-avatar-offline-android-20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact commit and source tree
        run: git rev-parse HEAD HEAD^{tree}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Install existing Flutter dependencies
        run: flutter pub get
      - name: Test standalone body and offline preview
        run: flutter test test/vision_assistant_avatar_test.dart test/vision_avatar_preview_app_test.dart --reporter expanded
      - name: Compile preview-only Android APK without install or distribution
        run: flutter build apk --debug --target lib/vision/vision_avatar_preview_main.dart
      - name: Verify debug APK exists without publishing it
        run: test -s build/app/outputs/flutter-apk/app-debug.apk
      - name: Inspect preview Android package metadata and manifest permissions
        shell: bash
        run: |
          set -euo pipefail
          aapt_tool=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          test -n "$aapt_tool"
          "$aapt_tool" dump badging build/app/outputs/flutter-apk/app-debug.apk > "$RUNNER_TEMP/vision-avatar-preview-badging.txt"
          grep -Fq "package: name='com.example.andi_carpeta'" "$RUNNER_TEMP/vision-avatar-preview-badging.txt"
          sed -n '/^package:/p;/^sdkVersion:/p;/^targetSdkVersion:/p' "$RUNNER_TEMP/vision-avatar-preview-badging.txt"
          "$aapt_tool" dump permissions build/app/outputs/flutter-apk/app-debug.apk
      # Explicitly no upload-artifact, Firebase emulator/live access,
      # deployment, signing, Play Store publishing, billing or device install.
