name: Android v3.0.3 test build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact v3.0.1 candidate patch
        shell: bash
        run: |
          set -euo pipefail
          test -f AndiCarpet-v3.0.1-IMPORT-TESTARE.zip || { echo "Missing patch ZIP in repository root"; exit 1; }
          unzip -o AndiCarpet-v3.0.1-IMPORT-TESTARE.zip -d .
          # Patch the missing unnamed constructor in the supplied OCR source.
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/ocr_position_learning.dart')
          src = path.read_text(encoding='utf-8')
          needle = 'class OcrLearningStatistics {'
          assert src.count(needle) == 1, 'OCR statistics class changed; review required'
          path.write_text(src.replace(needle, needle + '\n  OcrLearningStatistics();', 1), encoding='utf-8')
          PY
          python3 -m py_compile tools/apply_v302_fixes.py tools/apply_v303_fixes.py tools/apply_widget_layout_v302.py
          node functions/scripts/check_member_directory_projection.js
          python3 tools/apply_v302_fixes.py
          python3 tools/apply_v303_fixes.py
          python3 tools/apply_widget_layout_v302.py
          test -f lib/ocr_position_learning.dart
          test -f android/app/src/main/kotlin/com/example/andi_carpeta/RouteWidgetProvider.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
        continue-on-error: true
      - name: Set Android release version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pubspec.yaml')
          s = p.read_text(encoding='utf-8')
          import re
          s, count = re.subn(r'(?m)^version:\s*[^\n]+
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AndiCarpet-v3.0.3-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
, 'version: 3.0.3+35', s)
          assert count == 1, 'Missing unique pubspec version'
          p.write_text(s, encoding='utf-8')
          PY
      - name: Build debug APK
        run: flutter build apk --debug --build-name=3.0.3 --build-number=35
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AndiCarpet-v3.0.2-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
