name: Mission VIII Spark finance and security
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: mission-viii-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  emulator:
    if: github.head_ref == 'fix/finance-spark-safe-mission-viii-20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: git rev-parse HEAD HEAD^{tree}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-save --no-package-lock firebase-tools@14 @firebase/rules-unit-testing@5 firebase@12
      - name: Reproduce actual insecure legacy ACL before repair
        shell: bash
        run: |
          set +e
          npx firebase emulators:exec --only firestore --project demo-andi-carpet --config firebase.rules-test.json 'node --test tests/firestore/finance_viii_acl.red.cjs' 2>&1 | tee "$RUNNER_TEMP/viii-red.txt"
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -ne 0
          grep -Fq '# fail 6' "$RUNNER_TEMP/viii-red.txt"
          grep -Fq '# pass 2' "$RUNNER_TEMP/viii-red.txt"
          grep -Fq 'VIII_RED even admin cannot bypass' "$RUNNER_TEMP/viii-red.txt"
  dart:
    if: github.head_ref == 'fix/finance-spark-safe-mission-viii-20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: git rev-parse HEAD HEAD^{tree}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/finance_intent*_test.dart --reporter expanded
