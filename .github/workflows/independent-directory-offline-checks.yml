name: Independent directory offline checks
on:
  pull_request:
    paths:
      - 'tools/independent_release/reconcile_directory.py'
      - 'tools/independent_release/test_reconcile_directory.py'
      - 'tools/independent_release/audit_directory_privacy.py'
      - 'tools/independent_release/test_audit_directory_privacy.py'
      - 'tests/independent/member_directory_projection.test.cjs'
      - 'functions/member_directory_projection.js'
      - '.github/workflows/independent-directory-offline-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-directory-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline reconciliation tests
        run: python3 -m unittest discover -s tools/independent_release -p 'test_reconcile_directory.py' -v
      - name: Privacy projection audit unit tests
        run: python3 -m unittest discover -s tools/independent_release -p 'test_audit_directory_privacy.py' -v
      - name: Audit actual directory projection source
        run: python3 tools/independent_release/audit_directory_privacy.py functions/member_directory_projection.js
      - name: Real Node projection characterization tests
        run: node --test tests/independent/member_directory_projection.test.cjs
      - name: Syntax check
        run: python3 -m py_compile tools/independent_release/reconcile_directory.py tools/independent_release/audit_directory_privacy.py
