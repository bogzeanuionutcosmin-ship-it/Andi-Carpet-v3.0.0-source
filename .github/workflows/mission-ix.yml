name: Mission IX Spark finance and security
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: mission-ix-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  emulator:
    if: github.head_ref == 'fix/durable-journal-mission-xii-20261016' || github.head_ref == 'fix/finance-durable-integration-mission-ix-20261016' || github.head_ref == 'fix/finance-home-boundary-mission-x-20261016' || github.head_ref == 'fix/finance-history-legacy-safety-mission-xi-20261016'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: git rev-parse HEAD HEAD^{tree}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-save --no-package-lock firebase-tools@14 @firebase/rules-unit-testing@5 firebase@12
      - name: Strict ACL and atomic financial protocol acceptance
        run: npx firebase emulators:exec --only firestore --project demo-andi-carpet --config firebase.rules-test.json 'node --test --test-concurrency=1 tests/firestore/finance_viii_acl.red.cjs tests/firestore/finance_viii_atomic.test.cjs tests/firestore/finance_ix_compatibility.test.cjs tests/firestore/finance_xi_history.test.cjs'
  dart:
    if: github.head_ref == 'fix/durable-journal-mission-xii-20261016' || github.head_ref == 'fix/finance-durable-integration-mission-ix-20261016' || github.head_ref == 'fix/finance-home-boundary-mission-x-20261016' || github.head_ref == 'fix/finance-history-legacy-safety-mission-xi-20261016'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: git rev-parse HEAD HEAD^{tree}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/finance_intent*_test.dart --reporter expanded
  flutter-sdk-emulator:
    if: github.head_ref == 'fix/durable-journal-mission-xii-20261016' || github.head_ref == 'fix/finance-durable-integration-mission-ix-20261016' || github.head_ref == 'fix/finance-home-boundary-mission-x-20261016' || github.head_ref == 'fix/finance-history-legacy-safety-mission-xi-20261016'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: git rev-parse HEAD HEAD^{tree}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: npm install --no-save --no-package-lock firebase-tools@14 @firebase/rules-unit-testing@5 firebase@12
      - name: Actual Flutter Chrome SDK against local demo Auth and Firestore
        env:
          XI_HISTORY: ${{ (github.head_ref == 'fix/durable-journal-mission-xii-20261016' || github.head_ref == 'fix/finance-history-legacy-safety-mission-xi-20261016') && '1' || '0' }}
          XI_ENTRY: ${{ github.head_ref == 'fix/durable-journal-mission-xii-20261016' && 'test/finance_xii_sdk.browser.dart' || github.head_ref == 'fix/finance-history-legacy-safety-mission-xi-20261016' && 'test/finance_xi_sdk.browser.dart' || 'test/finance_ix_sdk.browser.dart' }}
        run: timeout --signal=TERM --kill-after=20s 8m npx firebase emulators:exec --only auth,firestore --project demo-andi-carpet --config firebase.mission-viii-test.json 'node tests/firestore/finance_viii_flutter_seed.cjs && if [ "$XI_HISTORY" = 1 ]; then node tests/firestore/finance_xi_flutter_seed.cjs; fi && node tests/firestore/finance_viii_browser_runner.cjs "$XI_ENTRY" && node tests/firestore/finance_viii_flutter_verify.cjs'

  durable-browser-journal:
    if: github.head_ref == 'fix/durable-journal-mission-xii-20261016'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: git rev-parse HEAD HEAD^{tree}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/journal-browser" --no-save --no-package-lock playwright@1.56.1
      - run: '"$RUNNER_TEMP/journal-browser/node_modules/.bin/playwright" install --with-deps chromium'
      - name: Real tabs, worker termination, browser SIGKILL and strict IndexedDB
        env:
          NODE_PATH: ${{ runner.temp }}/journal-browser/node_modules
        run: node --test --test-concurrency=1 tests/journal_v2/browser.test.cjs
