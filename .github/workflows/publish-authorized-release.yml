name: Publish Andi Carpeta web (authorized release)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-authorized-release.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-production-deploy
  cancel-in-progress: false

jobs:
  hosting:
    runs-on: ubuntu-latest
    environment: firebase-production
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate with Google Cloud OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/141489733149/locations/global/workloadIdentityPools/github-actions-andicarpet/providers/github-actions
          service_account: andicarpet-github-deploy@andicarpet-e777e.iam.gserviceaccount.com
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - name: Build production web
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        run: |
          flutter pub get
          flutter build web --release --dart-define=MAPBOX_ACCESS_TOKEN="$MAPBOX_ACCESS_TOKEN"
      - name: Publish Firebase Hosting
        run: |
          npm install --global firebase-tools
          firebase deploy --only hosting --project andicarpet-e777e --non-interactive
