name: Validate Flutter and Firebase

on:
  push:
    branches: [main, fix/grafic-end-to-end-xiv-20261017, fix/application-delivery-xv-20261017]
  pull_request:
    branches: [main, fix/grafic-edit-controls-20261017, fix/grafic-end-to-end-xiv-20261017]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-web:
    name: Flutter web build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Repository hygiene regression tests
        run: python3 -m unittest discover -s test -p 'repository_hygiene_test.py'
      - name: Run Flutter unit and widget tests
        run: flutter test test/
      - name: Build web
        run: flutter build web --release
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web/
          retention-days: 7

  functions-check:
    name: Firebase Functions syntax and dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Validate JavaScript syntax
        run: node --check index.js

  source-contracts:
    name: Python source and security contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run all Python source contracts
        run: python3 -m unittest discover -s test -p '*test.py' -v
      - name: Scan every tracked repository file
        run: python3 scripts/audit_repository.py
      - name: Upload complete audit inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-audit
          path: repository-audit.json
          if-no-files-found: warn
          retention-days: 14

  javascript-tests:
    name: Node projection tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run member directory projection tests
        run: node --test test/member_directory_projection.test.js

  firestore-rules:
    name: Firestore emulator authorization tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firebase emulator and test libraries
        run: npm install --no-save --no-package-lock firebase-tools@14 @firebase/rules-unit-testing@5 firebase@12
      - name: Run Firestore authorization tests
        run: npx firebase emulators:exec --only firestore --project demo-andi-carpet --config firebase.rules-test.json 'node --test tests/firestore/diurna.test.cjs tests/firestore/program_schedule.test.cjs'
