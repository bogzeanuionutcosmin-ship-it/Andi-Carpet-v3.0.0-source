name: Validate Flutter and Firebase

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-web:
    name: Flutter web build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Dart static analysis (fatal errors only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run Flutter unit tests
        run: flutter test
      - name: Build web
        run: flutter build web --release
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web/
          retention-days: 7

  functions-check:
    name: Firebase Functions syntax and dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Validate JavaScript syntax
        run: node --check index.js

  firestore-rules:
    name: Firestore rules emulator compilation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firestore test dependencies
        run: npm install --no-save --package-lock=false @firebase/rules-unit-testing@4 firebase@11
      - name: Test rules with local Firestore emulator
        run: npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-andi-carpet-rules 'node --test tests/*.test.cjs'
