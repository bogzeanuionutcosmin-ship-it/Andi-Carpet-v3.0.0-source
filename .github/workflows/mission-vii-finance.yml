name: Mission VII financial integrity (definite rejection)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: mission-vii-finance-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  isolated-probes:
    if: github.head_ref == 'fix/finance-dialog-integrity-mission-vii-20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: git rev-parse HEAD HEAD^{tree}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Positive confirmed-save control
        run: flutter test test/settlement_edit_confirmed_characterization_test.dart --reporter expanded
      - name: Definite edit rejection must restore local fields
        run: flutter test test/settlement_edit_failure.red.dart test/finance_edit_rejection_test.dart --reporter expanded
      - name: Repaired lifecycle witnesses must actually pass
        run: flutter test test/settlement_create_cancel.red.dart test/vision_settlement_controller.red.dart test/finance_dialog_lifecycle_test.dart test/finance_received_amount_nonfinite.red.dart test/finance_received_amount_validation_test.dart --reporter expanded
      - name: Definite receipt rejection must preserve local entries and totals
        run: flutter test test/finance_received_state.red.dart test/finance_receipt_rejection_test.dart --reporter expanded
      - name: Financial session and observational boundaries
        run: flutter test test/finance_session_completion_test.dart test/finance_telemetry_boundary_test.dart test/finance_director_read_only_test.dart --reporter expanded
      - name: Definite close rejection must preserve closed and endDate
        run: flutter test test/finance_settlement_close_rollback.red.dart test/finance_close_rejection_test.dart --reporter expanded
      - name: Settlement writers must exclude each other while pending
        run: flutter test test/finance_cross_action_serialization_test.dart --reporter expanded
      - name: Uncertain outcomes are characterizations, not repaired financial acceptance
        run: flutter test test/finance_uncertain_outcome_test.dart --reporter expanded
      - name: Reproduce stale close shared-object mutation before session fix
        shell: bash
        run: |
          set +e
          flutter test test/finance_stale_close.red.dart --reporter expanded 2>&1 | tee "$RUNNER_TEMP/stale-close.txt"
          test_result=${PIPESTATUS[0]}
          set -e
          test "$test_result" -eq 1
          grep -Fq 'STALE_CLOSE_MUTATED_SHARED_OBSERVATION' "$RUNNER_TEMP/stale-close.txt"
          grep -Fq 'Some tests failed' "$RUNNER_TEMP/stale-close.txt"
          if grep -Fq 'Compilation failed' "$RUNNER_TEMP/stale-close.txt"; then exit 1; fi
          if grep -Fq 'RenderFlex overflowed' "$RUNNER_TEMP/stale-close.txt"; then exit 1; fi
          test "$(grep -c '^STALE_CLOSE_MUTATED_SHARED_OBSERVATION$' "$RUNNER_TEMP/stale-close.txt")" -eq 8
