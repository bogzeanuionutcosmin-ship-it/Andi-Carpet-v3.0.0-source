name: Firebase member directory deployment

on:
  workflow_dispatch:
    inputs:
      backfill:
        description: "Backfill existing member accounts after deploying the function"
        required: true
        type: choice
        options:
          - dry-run
          - apply
        default: dry-run

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-member-directory
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: firebase-production
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud without service account keys
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: andicarpet-e777e
          create_credentials_file: true
          export_environment_variables: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install Firebase tools and function dependencies
        run: |
          npm install --global firebase-tools
          cd functions
          npm ci
          node scripts/check_member_directory_projection.js
      - name: Deploy only member directory synchronization
        run: firebase deploy --project andicarpet-e777e --only functions:syncMemberDirectory --non-interactive
      - name: Preview member directory backfill
        working-directory: functions
        run: node scripts/backfill_member_directory.js
      - name: Apply existing account backfill
        if: ${{ inputs.backfill == 'apply' }}
        working-directory: functions
        env:
          APPLY_MEMBER_DIRECTORY_BACKFILL: '1'
        run: node scripts/backfill_member_directory.js
