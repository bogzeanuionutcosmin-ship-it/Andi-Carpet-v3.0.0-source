name: Restore member directory in production
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY_MEMBER_DIRECTORY only after explicit production approval'
        type: string
        required: true
      approved_sha:
        description: 'Exact reviewed main commit SHA approved for this deployment'
        type: string
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: firebase-production-deploy
  cancel-in-progress: false
jobs:
  restore:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY_MEMBER_DIRECTORY' && inputs.approved_sha == github.sha
    runs-on: ubuntu-latest
    environment: firebase-production
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/141489733149/locations/global/workloadIdentityPools/github-actions-andicarpet/providers/github-actions
          service_account: andicarpet-github-deploy@andicarpet-e777e.iam.gserviceaccount.com
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and install
        run: |
          node --check functions/index.js
          node --check functions/backfill_member_directory.js
          npm ci --prefix functions
          npm install --global firebase-tools
      - name: Deploy member directory read rules
        run: firebase deploy --only firestore:rules --project andicarpet-e777e --non-interactive
      - name: Deploy member directory sync trigger
        run: firebase deploy --only functions:syncMemberDirectory --project andicarpet-e777e --non-interactive
      - name: Backfill existing members
        run: node functions/backfill_member_directory.js
