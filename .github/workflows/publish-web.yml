name: Publish AndiCarpet web to Firebase Hosting

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: false

jobs:
  deploy-hosting:
    name: Publish web (Hosting only)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Check Flutter
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
      - name: Build web
        run: flutter build web --release
      - name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@14
      - name: Publish Firebase Hosting only
        run: firebase deploy --only hosting --project andicarpet-e777e --non-interactive
