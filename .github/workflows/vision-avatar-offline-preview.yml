name: Vision Avatar Offline Preview (compile only)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vision-avatar-offline-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  offline-avatar-preview:
    if: github.head_ref == 'feat/vision-avatar-offline-preview-20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show exact checkout tree
        run: git rev-parse HEAD HEAD^{tree}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Get offline preview dependencies
        run: flutter pub get
      - name: Exercise body and offline preview without Firebase initialization
        run: flutter test test/vision_assistant_avatar_test.dart test/vision_avatar_preview_app_test.dart --reporter expanded
      - name: Compile offline preview entrypoint (no publish)
        run: flutter build web --release --target lib/vision/vision_avatar_preview_main.dart
      - name: Confirm local web output only
        run: test -s build/web/index.html
      # No upload-artifact, deploy, secrets, Firebase configuration, or release.
