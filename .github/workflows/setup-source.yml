name: Setup Flutter source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-source:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract canonical source
        shell: bash
        run: |
          ZIP_NAME="Andi_Carpet_v3.0.0_FINAL_CANONICAL_SOURCE.zip"

          if [ ! -f "$ZIP_NAME" ]; then
            echo "Nu gasesc arhiva: $ZIP_NAME"
            exit 1
          fi

          rm -rf _extracted
          mkdir _extracted
          unzip -q "$ZIP_NAME" -d _extracted

          FIRST_ITEM="$(find _extracted -mindepth 1 -maxdepth 1 | head -n 1)"
          ITEM_COUNT="$(find _extracted -mindepth 1 -maxdepth 1 | wc -l)"

          if [ "$ITEM_COUNT" -eq 1 ] && [ -d "$FIRST_ITEM" ]; then
            SOURCE_DIR="$FIRST_ITEM"
          else
            SOURCE_DIR="_extracted"
          fi

          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            "$SOURCE_DIR"/ ./

          rm -rf _extracted
          rm -f "$ZIP_NAME"

      - name: Commit extracted project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nu exista modificari de salvat."
            exit 0
          fi

          git commit -m "Extract canonical Andi Carpet v3.0.0 source"
          git push
