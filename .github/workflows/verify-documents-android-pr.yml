name: Verify documents PDF save on Android (PR)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-documents-android-pr.yml'
      - 'lib/documents/**'
      - 'lib/download_file*.dart'
      - 'lib/main.dart'
      - 'test/document_categories_test.dart'
      - 'test/documents_download_contract_test.py'

permissions:
  contents: read

concurrency:
  group: documents-android-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  android-document-build:
    if: github.head_ref == 'fix/documents-pv-download-20261013'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Test PV classification and structural contracts
        run: |
          flutter test test/document_categories_test.dart
          python3 -m unittest discover -s test -p 'documents_download_contract_test.py'
      - name: Compile Android (debug APK only, no deployment)
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        run: flutter build apk --debug --dart-define=MAPBOX_ACCESS_TOKEN="$MAPBOX_ACCESS_TOKEN"
      - name: Retain short-lived test artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndiCarpet-PR-Documents-Android-TEST
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 2
