
name: Import Andi Carpet v3.0.1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Import source from ZIP
        run: |
          python3 - <<'PY'
          import glob
          import os
          import shutil
          import stat
          import zipfile
          from pathlib import Path

          archives = glob.glob(
              "AndiCarpet-v3.0.1-GITHUB-VALIDARE-SURSA*.zip"
          )
          if len(archives) != 1:
              raise SystemExit(
                  f"Expected one v3.0.1 ZIP, found: {archives}"
              )

          root = Path.cwd().resolve()
          archive = Path(archives[0]).resolve()

          with zipfile.ZipFile(archive) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"Corrupt ZIP entry: {bad}")

              names = set(z.namelist())
              if "pubspec.yaml" not in names or "lib/main.dart" not in names:
                  raise SystemExit("Invalid Flutter project structure")

              for entry in z.infolist():
                  name = entry.filename
                  path = Path(name)

                  if (
                      path.is_absolute()
                      or ".." in path.parts
                      or not name
                  ):
                      raise SystemExit(f"Unsafe ZIP path: {name}")

                  mode = entry.external_attr >> 16
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f"Symlink not allowed: {name}")

                  target = (root / path).resolve()
                  if not target.is_relative_to(root):
                      raise SystemExit(f"Unsafe destination: {name}")

                  if entry.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                      continue

                  target.parent.mkdir(parents=True, exist_ok=True)
                  with z.open(entry) as src, open(target, "wb") as dst:
                      shutil.copyfileobj(src, dst)

          print("Source v3.0.1 imported successfully")
          PY

      - name: Commit updated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || \
            git commit -m "Import Andi Carpet v3.0.1 source"
          git push
