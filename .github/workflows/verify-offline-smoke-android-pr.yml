name: Offline smoke APK - separate install, no Firebase

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-offline-smoke-android-pr.yml'
      - 'lib/testing/**'
      - 'lib/download_file*.dart'
      - 'lib/vision/**'
      - 'assets/**'
      - 'test/**'
      - 'pubspec.yaml'

permissions:
  contents: read

jobs:
  standalone-offline-android:
    if: github.head_ref == 'integration/vision-documents-20261013' || github.head_ref == 'feat/vision-local-report-20261014'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Flutter dependencies and local tests
        run: |
          flutter pub get
          flutter test test/vision_error_log_test.dart test/vision_diagnostics_page_test.dart test/vision_diagnostic_report_test.dart test/vision_diagnostic_advisor_test.dart test/vision_diagnostic_coverage_test.dart test/vision_expense_save_verifier_test.dart test/document_categories_test.dart test/pv_million_asset_test.dart

      - name: Isolate APK from production ONLY in this CI runner
        env:
          VISION_TEST_RUN: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          run = os.environ['VISION_TEST_RUN']
          assert run.isdecimal() and int(run) > 0
          gradle = Path('android/app/build.gradle.kts')
          s = gradle.read_text()
          g = '    id("com.google.gms.google-services")'
          b = '    buildTypes {\n'
          assert s.count(g) == 1 and s.count(b) == 1
          # No Google Services plugin: standalone entry point does not
          # initialize Firebase, and no Firebase Android app is configured.
          s = s.replace(g, '    // Offline smoke: Google Services disabled in temporary CI copy')
          # GitHub runners can use different DEBUG signing certificates.
          # A distinct package ID PER RUN makes installation unambiguous and
          # avoids Android refusing an in-place update over a prior test.
          s = s.replace(b, b + '        getByName("debug") {\n'
                        f'            applicationIdSuffix = ".smokeoffline.r{run}"\n'
                        '        }\n', 1)
          gradle.write_text(s)
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          assert 'android:label="Andi Carpetă"' in text
          manifest.write_text(text.replace(
              'android:label="Andi Carpetă"',
              f'android:label="Vision TEST #{run}"', 1))
          # Strip location, camera, SMS and networking permissions for smoke.
          debug_manifest = Path('android/app/src/debug/AndroidManifest.xml')
          permissions = [
              'INTERNET', 'ACCESS_COARSE_LOCATION', 'ACCESS_FINE_LOCATION',
              'ACCESS_BACKGROUND_LOCATION', 'FOREGROUND_SERVICE',
              'FOREGROUND_SERVICE_LOCATION', 'CAMERA', 'POST_NOTIFICATIONS',
              'SEND_SMS'
          ]
          debug_manifest.write_text(
              '<manifest xmlns:android="http://schemas.android.com/apk/res/android" '
              'xmlns:tools="http://schemas.android.com/tools">\n' +
              ''.join(
                  f'  <uses-permission android:name="android.permission.{p}" '
                  'tools:node="remove" />\n' for p in permissions
              ) +
              '</manifest>\n')
          PY

      - name: Build debug APK with standalone test entry point
        run: |
          flutter build apk --debug \
            --target lib/testing/vision_documents_offline_smoke.dart \
            --build-name=0.8.0 \
            --build-number=$((100000 + ${{ github.run_number }})) \
            --dart-define=VISION_OFFLINE_SMOKE=true \
            --dart-define=VISION_SMOKE_RUN=${{ github.run_number }} \
            --dart-define=MAPBOX_ACCESS_TOKEN=
          cp build/app/outputs/flutter-apk/app-debug.apk \
            build/app/outputs/flutter-apk/AndiCarpet-Vision-TEST-R${{ github.run_number }}.apk

      - name: Verify unique package id and forbidden permissions
        env:
          VISION_TEST_RUN: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import subprocess
          sdk = pathlib.Path(os.environ['ANDROID_HOME'])
          aapts = list((sdk / 'build-tools').glob('*/aapt'))
          assert aapts, "Android aapt is missing"
          aapt = sorted(aapts)[-1]
          apk = 'build/app/outputs/flutter-apk/app-debug.apk'
          badging = subprocess.check_output(
              [str(aapt), 'dump', 'badging', apk], text=True)
          run = os.environ['VISION_TEST_RUN']
          expected = f"package: name='com.example.andi_carpeta.smokeoffline.r{run}'"
          assert expected in badging, f'Unsafe package ID: {badging[:250]}'
          expected_code = f"versionCode='{100000 + int(run)}'"
          assert expected_code in badging, f'Wrong build number: {badging[:350]}'
          assert "versionName='0.8.0'" in badging, badging[:350]
          perms = subprocess.check_output(
              [str(aapt), 'dump', 'permissions', apk], text=True)
          for forbidden in (
              'android.permission.INTERNET',
              'android.permission.SEND_SMS',
              'android.permission.ACCESS_FINE_LOCATION',
              'android.permission.ACCESS_COARSE_LOCATION',
              'android.permission.ACCESS_BACKGROUND_LOCATION',
              'android.permission.CAMERA',
          ):
              assert forbidden not in perms, f'Unexpected permission: {forbidden}'
          print('Safe standalone APK package and permissions verified.')
          PY

      - name: Confirm original Million PDF in offline test APK
        run: |
          python3 - <<'PY'
          import hashlib
          import zipfile
          path = 'build/app/outputs/flutter-apk/app-debug.apk'
          with zipfile.ZipFile(path) as apk:
              pdf = apk.read('assets/flutter_assets/assets/pv_million.pdf')
          actual = hashlib.sha256(pdf).hexdigest()
          expected = '3bece2fa6f39d1bbba904ea45856d60215c8cfb3f0d23c80767662ffa4bdcd23'
          assert actual == expected
          print('PV Million original bundled unchanged, bytes:', len(pdf))
          PY

      - name: Upload ONLY separately-installable smoke test APK
        uses: actions/upload-artifact@v4
        with:
          name: AndiCarpet-Vision-TEST-R${{ github.run_number }}-NO-FIREBASE
          path: build/app/outputs/flutter-apk/AndiCarpet-Vision-TEST-R${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 3
