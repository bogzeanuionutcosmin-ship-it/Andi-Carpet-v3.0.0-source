name: andi_carpeta
description: Aplicatia Andi Carpeta pentru program, locatii, executii, decont si documente.
publish_to: 'none'
version: 3.0.1+33

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  printing: ^5.14.2
  url_launcher: ^6.3.2
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  firebase_messaging: ^16.7.0
  cloud_firestore: ^6.10.0
  pdf: ^3.13.1
  file_picker: ^13.1.0
  geolocator: ^14.0.2
  image: ^4.5.4
  image_picker: ^1.2.3
  google_mlkit_text_recognition: ^0.17.1
  http: ^1.2.2
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/ui/
    - assets/badges/
    - assets/stickers/
    - assets/themes/
    - assets/logos/
